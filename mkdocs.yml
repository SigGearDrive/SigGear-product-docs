      name: SigGear on YouTube
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/luffywan.robotics/
      name: Wanrong Wang / SigGear on Instagram
    - icon: fontawesome/brands/tiktok
      link: https://www.tiktok.com/@robotactuator.engineer
      name: Robot Actuator Engineer / SigGear on TikTok
  analytics:
    provider: google
    property: G-Q14K9BLGK4
  consent:
    title: Cookie consent
    description: >-
      We use optional analytics cookies to understand how visitors use this site
      and to improve our product documentation. Analytics data is sent only after
      you give consent.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage

