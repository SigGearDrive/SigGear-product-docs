version: "1.0"
updated: "2026-10-13"
owner: "SigGear overseas operations"
objective: >
  Map exact engineering-resource search intent to existing public Datasheet
  and Mechanical Interface pages without creating duplicate SEO pages.

baseline:
  period: "2026-07-15 to 2026-10-13"
  exact_query_rows_found: 0
  rule: "Do not infer ranking until Search Console records impressions."

principles:
  - "Datasheet queries map to the existing model Datasheet."
  - "Dimensions, drawing and mechanical-interface queries map to the existing Mechanical Interface page."
  - "STEP / CAD queries map to the public planetary CAD library or model-specific released CAD resources."
  - "Do not publish a new dimensions or drawing page when the existing controlled resource already answers the intent."
  - "Do not expose manufacturing drawings or internal planetary transmission geometry."

models:
