      - "gearbox for BLDC motor"
      - "custom gear motor"
      - "custom gearmotor"
    secondary_intent:
      - "match gearbox to motor"
      - "motor with planetary gearbox"
      - "motor gearbox matching"
      - "gear motor engineering"
    canonical_page: "/custom-engineering/motor-gearbox-integration/"
    status: "existing_page"
    user_need: "Keep an existing motor or define a complete motor + gearbox operating point and interface."

  - id: "custom-cycloidal"
    priority: "P0"
    stage: "supplier discovery + engineering evaluation"
    primary_intent:
      - "custom cycloidal gearbox"
      - "custom cycloidal reducer"
      - "cycloidal drive engineering"
    secondary_intent:
