next_content_rules:
  - "Do not create a new page when an existing canonical page already matches the intent."
  - "Create a new engineering page only when the searcher has a distinct technical problem that cannot be answered well by an existing page."
  - "Before creating a CAD-intent page, confirm that the referenced CAD is approved for public release."
  - "Titles may use a high-intent synonym; body copy must still read naturally for engineers."
  - "Use model pages for exact dimensions and ratings; use custom-engineering pages for problem-solving and supplier qualification."
