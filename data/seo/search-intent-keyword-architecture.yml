version: "1.0"
updated: "2026-09-28"
owner: "SigGear overseas operations"
objective: >
  Help engineers who do not yet know SigGear discover the company through
  engineering, supplier, customization, CAD/design-in and application search intent.

principles:
  - "One primary search intent per canonical page."
  - "Use engineer terminology naturally; do not create keyword-only pages."
  - "Keep product values tied to approved sources."
  - "Treat standard products as reference platforms, not the limit of custom capability."
  - "Do not imply a public customer case from an application keyword."
  - "Do not claim every requested customization is feasible."
  - "Prefer gearbox + gearhead and gear motor + gearmotor language where it reflects real engineering usage."
  - "CAD / STEP intent should point only to models with released public files."

intent_clusters:
  - id: "custom-transmission"
    priority: "P0"
    stage: "supplier discovery"
    primary_intent:
      - "custom gearbox engineering"
      - "custom precision transmission"
      - "compact transmission engineering"
    secondary_intent:
      - "custom gearbox manufacturer"
      - "precision gearbox supplier"
      - "custom gear reducer"
    canonical_page: "/custom-engineering/"
    status: "existing_page"
    user_need: "Find a supplier that can evaluate an incomplete transmission problem, drawing, motor or mechanism."

  - id: "custom-planetary"
    priority: "P0"
    stage: "supplier discovery + engineering evaluation"
    primary_intent:
      - "custom planetary gearbox"
      - "custom planetary gearhead"
      - "miniature planetary gearbox"
      - "compact planetary gearhead"
    secondary_intent:
      - "planetary gearbox custom shaft"
      - "planetary gearbox custom mounting"
      - "planetary gearbox custom ratio"
      - "planetary gearbox for existing motor"
    canonical_page: "/custom-engineering/custom-planetary-gearbox/"
    status: "existing_page"
    user_need: "Adapt a planetary reducer around a motor, envelope, ratio, shaft or mounting requirement."

  - id: "motor-gearbox-integration"
    priority: "P0"
    stage: "engineering evaluation"
    primary_intent:
