version: "1.0"
updated: "2026-10-13"
owner: "SigGear overseas operations"
objective: >
  Expand qualified overseas demand for SigGear's 8P–42P miniature and compact
  planetary gearbox range by strengthening distinct engineering search intents,
  CAD/design-in paths and contextual inquiry entry points.

principles:
  - "Strengthen an existing canonical page before creating a new page."
  - "One primary engineering problem should map to one canonical application page."
  - "Application content describes potential engineering use, not a published customer case."
  - "Do not assign a gearbox size or performance claim without a confirmed requirement and approved product data."
  - "Every P0 application path should connect to the 8–42 mm series, public STEP references and a contextual Engineering Project Brief."
  - "Robot joint pages remain indexed and maintained, but are not the primary near-term overseas growth path."
  - "Create new content only when the searcher has a distinct mechanism or selection problem that an existing page cannot answer well."

priority_paths:
  P0:
    - id: "electric_pruning_shears"
      intent: "electric pruning shears planetary gearbox"
      canonical_page: "/applications/electric-pruning-shears-planetary-gearbox/"
      inquiry_app: "electric_pruning_shears"
      action: "defend_and_measure_existing_page"
    - id: "electric_curtain_blind"
      intent: "electric curtain / blind planetary gear motor"
      canonical_page: "/applications/electric-curtain-blind-window-opener-gear-motors/"
      inquiry_app: "electric_curtain_blind"
      action: "defend_and_measure_existing_page"
    - id: "smart_toilet_bidet"
      intent: "smart toilet / bidet planetary gear motor"
      canonical_page: "/applications/smart-toilet-bidet-planetary-gear-motors/"
      inquiry_app: "smart_toilet_bidet"
      action: "defend_and_measure_existing_page"
    - id: "dexterous_hand_gripper"
      intent: "dexterous hand / robot gripper planetary gear motor"
      canonical_page: "/applications/robot-gripper-gear-motors/"
      inquiry_app: "dexterous_hand_gripper"
      action: "strengthen_and_measure_existing_page"
    - id: "smart_lock_access_control"
      intent: "smart lock / access-control miniature planetary gear motor"
      canonical_page: "/applications/access-control-smart-lock-security-gear-motors/"
      inquiry_app: "smart_lock_access_control"
      action: "strengthen_existing_page"
    - id: "pump_valve_fluid"
