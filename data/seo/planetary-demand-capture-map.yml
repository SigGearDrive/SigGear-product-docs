  engineering_resource_library: "/engineering-resources/planetary-gearboxes/"
  inquiry_page: "/request-cad-sample-quote/"

new_page_gate:
  required_before_creation:
    - "distinct_searcher_problem"
    - "no_existing_canonical_page_answers_it_well"
    - "real_siggear_product_or_engineering_capability_can_support_the_content"
    - "no_unverified_product_claim_required"
  otherwise: "improve_existing_page"
