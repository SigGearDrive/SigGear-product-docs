schema_version: 1
workflow_id: planetary-motor-matching-design-in
updated: "2026-10-13"
scope: public_safe_engineering_routing

objective: >
  Route an engineer who already has a motor from an 8P-42P planetary gearbox
  page into a model-aware engineering review without implying universal motor compatibility.

truth_boundary:
  universal_motor_compatibility_claim: false
  standardized_adapter_released_for_every_frame: false
  dedicated_public_motor_integration_guides:
    - 32P
    - 42P
  rule: >
    Datasheet and Mechanical Interface availability does not prove that a specific
    customer motor is compatible with the selected gearbox frame.

existing_motor_input:
  preferred_first_artifact: motor_drawing_or_exact_model
  fields:
    - motor_type
    - motor_voltage_if_relevant
    - rated_or_loaded_speed
    - shaft_diameter
    - usable_shaft_length
    - shaft_feature
    - mounting_hole_pattern
    - locating_pilot
    - required_output_speed_or_ratio
    - continuous_and_peak_load_if_known
    - maximum_assembly_envelope
    - duty_cycle
    - prototype_quantity
    - expected_annual_volume

review_gates:
  - frame_and_envelope
  - motor_operating_point
  - output_speed_and_ratio
  - continuous_and_peak_load
  - motor_to_gearbox_mechanical_interface
  - controlled_configuration_release

design_in_sequence:
  - choose_candidate_frame
  - review_model_datasheet
  - review_model_mechanical_interface
  - check_motor_speed_and_output_target
  - check_load_and_duty_cycle
  - compare_motor_shaft_pilot_and_mounting
  - use_public_step_for_preliminary_packaging
  - confirm_stage_ratio_and_motor_interface
  - request_configuration_matched_controlled_cad
  - validate_sample_in_actual_application

