schema_version: 1
workflow_id: planetary-ratio-stage-selection
updated: "2026-10-13"
scope: public_safe_preliminary_design_in

canonical_page: docs/selection-guides/miniature-planetary-gearbox-selection-guide.md
selector_data: docs/assets/data/planetary-ratio-stage-data.json
validation_script: scripts/validate_ratio_stage_selector_data.py

calculation:
  preliminary_target_ratio: motor_operating_speed_rpm / target_output_speed_rpm
  candidate_sort: absolute_percentage_difference_from_target_ratio
  maximum_visible_candidates: 12

required_inputs:
  - motor_operating_speed_rpm
  - target_output_speed_rpm

optional_filters:
  maximum_gearbox_diameter_mm:
    comparison: candidate_diameter_less_than_or_equal_to_input
  maximum_gearbox_body_length_mm:
    comparison: published_stage_body_length_less_than_or_equal_to_input
    boundary: gearbox_body_only_not_total_motor_gearbox_length
  required_continuous_torque_kgf_cm:
    comparison: published_rated_allowable_torque_greater_than_or_equal_to_input
    prohibited: use_maximum_momentary_torque_as_continuous_rating
  maximum_ratio_difference_percent:
    comparison: candidate_absolute_ratio_difference_less_than_or_equal_to_input
    default: no_filter

candidate_fields:
  - model
  - nominal_diameter_mm
  - stage_count
  - published_ratio
  - estimated_output_speed_rpm
  - ratio_difference_percent
  - gearbox_body_length_mm
  - published_rated_allowable_torque_kgf_cm
  - published_efficiency_percent

candidate_frame_comparison:
  one_row_per_model: closest_remaining_published_ratio
  first_check_signals:
    closest_ratio: minimum_ratio_difference_percent
    smallest_surviving_frame: minimum_nominal_diameter_after_active_filters
    shortest_surviving_gearbox: minimum_published_gearbox_body_length_after_active_filters
  labels_are_final_recommendations: false
  excluded_frame_reason_visible: true

truth_boundary:
  tool_is_final_selection: false
  automatic_safety_factor: false
  motor_shaft_torque_calculation: false
  motor_compatibility_proven: false
  service_life_prediction: false
  noise_prediction: false
  thermal_prediction: false
  final_cad_released: false

required_final_review:
  - motor_operating_point
  - continuous_and_peak_load
  - duty_cycle
  - radial_and_axial_shaft_loads
  - motor_shaft_pilot_and_mounting_interface
  - selected_model_stage_and_ratio
  - controlled_configuration_drawing_or_cad

privacy:
  ga4_raw_engineering_inputs: prohibited
  ga4_allowed:
    - filter_presence_flags
    - result_count
    - candidate_frame_count
    - normalized_top_candidate_model
    - normalized_top_candidate_stage
    - normalized_smallest_candidate_model
    - normalized_shortest_candidate_model

data_integrity:
  source_of_truth: published_model_datasheet_stage_tables
  ci_rule: selector_json_must_match_all_12_datasheet_stage_tables
