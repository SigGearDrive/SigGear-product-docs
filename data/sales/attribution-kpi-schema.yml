schema_version: 1
policy_id: attribution-kpi-schema
scope: public_safe_channel_and_funnel_measurement
attribution_baseline_date: 2026-10-13

principles:
  - do_not_retroactively_guess_historical_sources
  - pipeline_source_requires_reliable_evidence_or_customer_context
  - website_high_intent_is_not_a_received_inquiry
  - qualified_inquiry_requires_offline_confirmation
  - customer_project_stage_is_separate_from_siggear_sales_stage
  - outbound_platform_clicks_do_not_prove_platform_acquisition

pipeline_source_labels:
  google_organic: "Google Search"
  ai_geo: "ChatGPT / GEO"
  traceparts: "TraceParts"
  3dfindit: "3Dfindit"
  directindustry: "DirectIndustry"
  globalspec: "GlobalSpec"
  youtube: "YouTube"
  linkedin: "LinkedIn"
  instagram: "Instagram"
  tiktok: "TikTok"
  partner: "Partner"
  exhibition: "Exhibition"
  referral: "Referral"
  direct_outreach: "Direct Outreach"
  existing_customer: "Existing Customer"
  other: "Other"

source_evidence_rules:
  google_organic:
    accepted_evidence:
      - google_organic_session_or_referrer
      - search_console_query_or_click_context
      - customer_says_found_via_google
  ai_geo:
    accepted_evidence:
      - ai_assistant_referrer_when_available
      - customer_says_found_via_chatgpt_gemini_perplexity_copilot_or_other_ai_search
    note: "Pipeline label remains ChatGPT / GEO for compatibility with the existing workbook."
  traceparts:
    accepted_evidence:
      - traceparts_referrer_or_lead_record
      - customer_says_found_via_traceparts
    not_sufficient:
      - traceparts_catalog_click_from_siggear_site
  3dfindit:
    accepted_evidence:
      - 3dfindit_referrer_or_lead_record
      - customer_says_found_via_3dfindit
  directindustry:
    accepted_evidence:
      - directindustry_lead_or_referrer
      - customer_says_found_via_directindustry
  globalspec:
    accepted_evidence:
      - globalspec_lead_or_referrer
      - customer_says_found_via_globalspec
  social:
    accepted_evidence:
      - platform_referrer_or_campaign_tag
      - customer_says_found_via_platform
  other:
    use_when:
      - source_not_known
      - evidence_is_ambiguous

website_funnel_kpis:
  search_discovery:
    source: google_search_console
    metrics:
      - impressions
      - clicks
      - ctr
      - average_position
    interpretation: "Search discovery happens before the website session. Do not merge Search Console impressions with GA4 sessions."
  site_discovery:
    source: ga4
    metrics:
      - sessions
      - active_users
  engineering_interest:
    events:
      - cad_download_click
      - priority_application_click
      - ratio_stage_selector_run
      - candidate_design_in_pack_view
  inquiry_intent:
    events:
      - engineering_brief_open_click
      - inquiry_page_view
      - engineering_brief_copy
  high_intent:
    events:
      - engineering_brief_prepare_email
      - sample_validation_prepare_email
      - design_in_review_prepare_email
      - pilot_preparation_prepare_email
      - production_release_prepare_email
      - planetary_inquiry_click
    interpretation: "High-intent or lifecycle website behavior only. Do not count as a received inquiry or an offline sales-stage transition."
  engineering_lifecycle:
    entry_events:
      - sample_validation_candidate_view
      - design_in_review_candidate_view
      - pilot_preparation_review_view
      - production_release_review_view
    interpretation:
      - later_stage_events_may_belong_to_existing_projects
      - do_not_treat_lifecycle_event_counts_as_new_leads
      - do_not_calculate_person_level_cross_stage_conversion_without_reliable_user_scope

pipeline_funnel_kpis:
  total_projects:
    definition: "All project records assigned to the source."
  qualified_plus:
    stages:
      - Qualified
      - Solution Proposed
      - Sample Ordered
      - Sample Delivered
      - Testing
      - Prototype
      - Design-In
      - Pilot Order
      - Mass Production
  sample_plus:
    stages:
      - Sample Ordered
      - Sample Delivered
      - Testing
      - Prototype
      - Design-In
      - Pilot Order
      - Mass Production
  design_in_plus:
    stages:
      - Design-In
      - Pilot Order
      - Mass Production
  qualified_rate:
    formula: qualified_plus / total_projects
  design_in_rate:
    formula: design_in_plus / total_projects

customer_project_stage:
  allowed:
    - Concept
    - Prototype
    - Pilot
    - Production
  rule: "Populate only when the customer reveals or clearly documents the stage; do not infer from SigGear sales stage."

dashboard_interpretation:
  website_dashboard_answers:
    - how_many_users_reached_engineering_assets
    - how_many_users_opened_or_prepared_an_inquiry
  pipeline_dashboard_answers:
    - which_sources_created_real_projects
    - which_sources_reached_qualified_sample_or_design_in
  combined_analysis_rule: "Compare aggregate trends by source and period. Do not claim person-level cross-system attribution without reliable evidence."
