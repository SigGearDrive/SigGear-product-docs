schema_version: 1
policy_id: inquiry-measurement-schema
scope: public_safe_aggregate_measurement

measurement_principle:
  website_events_measure: user_intent_and_form_progress
  website_events_do_not_prove: email_sent_or_inquiry_received
  qualified_inquiry_requires: offline_manual_confirmation_after_actual_contact

website_funnel:
  discovery:
    - page_view
    - campaign_landing
    - social_landing
    - traceparts_catalog_click
  engineering_evidence:
    - cad_download_click
    - priority_application_click
    - ratio_stage_selector_run
    - candidate_design_in_pack_view
    - sample_validation_candidate_view
    - sample_validation_summary_copy
  inquiry_intent:
    - engineering_brief_open_click
    - inquiry_page_view
    - selector_candidate_handoff_validated
    - engineering_brief_copy
  high_intent:
    - engineering_brief_prepare_email
    - sample_validation_prepare_email
    - planetary_inquiry_click

qualified_inquiry_definition:
  required:
    - actual_message_or_request_received_by_siggear
    - real_application_mechanism_or_product_need
    - enough_context_for_a_meaningful_next_action
    - identifiable_reply_path
  not_required_at_first_contact:
    - final_reduction_ratio
    - complete_torque_calculation
    - final_motor_selection
    - exact_annual_volume
    - company_name
  possible_outcomes:
    - needs_more_information
    - engineering_review_ready
    - quotation_or_sample_review_ready
    - no_published_match_or_custom_review
    - not_fit_or_non_buying_research

normalized_website_dimensions:
  inquiry_model:
    allowed:
      - 8P
      - 10P
      - 12P
      - 14P
      - 16P
      - 20P
      - 22P
      - 24P
      - 28P
      - 32P
      - 36P
      - 42P
      - not_specified
  inquiry_type:
    allowed:
      - gearbox_only
      - motor_gearbox
      - not_sure
      - planetary_general
      - application_review
      - general_email
  inquiry_application:
    allowed:
      - electric_pruning_shears
      - electric_curtain_blind
      - smart_toilet_bidet
      - dexterous_hand_gripper
      - smart_lock_access_control
      - pump_valve_fluid
      - optical_positioning
      - coffee_equipment
      - not_specified
  inquiry_origin:
    allowed:
      - homepage
      - planetary_series
      - product_model
      - engineering_resource
      - selection_tool
      - application
      - internal_other
      - direct_or_external
      - unknown
  project_stage:
    allowed:
      - concept
      - prototype
      - pilot
      - production
      - not_specified
  field_coverage_band:
    allowed:
      - 0_2
      - 3_4
      - 5_plus
  cad_readiness_status:
    allowed:
      - ready_for_cad_review
      - need_more_information
      - not_applicable
  sample_validation_status:
    allowed:
      - validation_in_progress
      - engineering_iteration_required
      - ready_to_submit_for_design_in_review
  sample_validation_outcome:
    allowed:
      - not_decided
      - keep_current_configuration
      - change_ratio
      - change_motor_or_input
      - revise_mechanical_interface
      - more_testing_required
      - ready_for_design_in_review
  offline_source_group:
    allowed:
      - google_organic
      - ai_referral
      - traceparts
      - 3dfindit
      - directindustry
      - globalspec
      - youtube
      - linkedin
      - instagram
      - tiktok
      - partner
      - exhibition
      - referral
      - direct_outreach
      - existing_customer
      - other

privacy_boundary:
  ga4_may_receive:
    - normalized_model_or_application_category
    - normalized_project_stage
    - requested_next_step_category
    - form_field_presence_flags
    - aggregate_field_coverage_count
    - normalized_internal_origin
    - normalized_ratio_stage_selector_result_count
    - normalized_ratio_stage_candidate_frame_count
    - normalized_top_candidate_model_and_stage
    - normalized_smallest_and_shortest_candidate_models
    - ratio_stage_filter_presence_flags
    - selector_handoff_flag
    - normalized_selector_candidate_stage
    - normalized_cad_readiness_status
    - cad_readiness_gate_presence_flags
    - normalized_sample_validation_status
    - normalized_sample_validation_outcome
  ga4_must_not_receive:
    - customer_name
    - email_address
    - phone_or_whatsapp
    - company_name
    - free_text_application_details
    - torque_speed_dimension_or_voltage_values
    - drawings_or_cad
    - quotation_or_price
    - customer_specific_requirements
    - ratio_stage_selector_raw_motor_speed
    - ratio_stage_selector_raw_output_speed
    - ratio_stage_selector_raw_diameter_length_or_torque_values
    - ratio_stage_selector_raw_ratio_tolerance
    - selector_candidate_ratio_from_url
    - output_interface_text
    - duty_cycle_or_peak_duration_text
    - external_shaft_load_text
    - sample_test_operating_condition_text
    - sample_observation_or_issue_notes
    - sample_measured_speed_torque_temperature_or_current_values
  public_repository_must_not_store:
    - customer_records
    - private_lead_status
    - customer_specific_qualification_notes
    - private_commercial_outcomes

offline_sales_record_minimum:
  - received_date
  - source_group
  - product_family_or_model
  - application_category
  - project_stage_if_known
  - qualification_outcome
  - current_sales_stage
  - next_action
