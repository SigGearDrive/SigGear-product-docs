name: Validate documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/motor_pdf_upload_parts/**"
      - "scripts/assemble_motor_pdfs.py"
      - ".github/cad_upload_parts/**"
      - ".github/joint_cad_upload_parts/**"
      - "scripts/assemble_joint_cad.py"
      - "scripts/assemble_public_cad.py"
      - "data/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/validate_docs.py"
      - "scripts/validate_geo_answer_readiness.py"
      - "scripts/validate_product_data.py"
      - "scripts/validate_22p_product_media.py"
      - "scripts/validate_sales_policy.py"
      - "scripts/validate_site_urls.py"
      - "scripts/validate_legacy_image_and_page_freeze.py"
      - "scripts/validate_planetary_product_photos.py"
      - "scripts/validate_external_catalog.py"
      - "scripts/export_external_catalog.py"
      - "scripts/export_traceparts_catalog.py"
      - "scripts/export_3dfindit_onboarding.py"
      - "scripts/validate_utm_links.py"
      - "scripts/validate_ratio_stage_selector_data.py"
      - "scripts/validate_selector_discovery_links.py"
      - "scripts/validate_application_selector_funnel.py"
      - "scripts/validate_application_quick_pages.py"
      - "scripts/validate_planetary_application_crosslinks.py"
      - "scripts/validate_inquiry_activation_assets.py"
      - "scripts/validate_planetary_input_speed_range.py"
      - "scripts/test_planetary_selector_v2.js"
      - "scripts/test_planetary_download_clicks.js"
      - "scripts/test_joint_download_clicks.js"
      - "scripts/validate_joint_quick_downloads.py"
      - "scripts/test_online_inquiry_delivery.js"
      - "scripts/validate_stage_specific_cad_boundary.py"
      - "scripts/validate_controlled_cad_readiness.py"
      - "scripts/validate_sample_validation_handoff.py"
      - "scripts/validate_design_in_review_decision.py"
      - "scripts/validate_pilot_preparation.py"
      - "scripts/validate_production_release_readiness.py"
      - "scripts/validate_end_to_end_planetary_funnel.py"
      - "scripts/validate_planetary_indexing_readiness.py"
      - "scripts/validate_planetary_download_assets.py"
      - "scripts/validate_motor_quick_downloads.py"
      - "scripts/test_motor_quick_downloads.js"
      - "scripts/build_joint_datasheets.py"
      - "scripts/build_hub_motor_datasheets.py"
      - "scripts/validate_hub_motor_datasheets.py"
      - "scripts/validate_joint_product_media.py"
      - "scripts/validate_sg6010hb_public_release.py"
      - "scripts/validate_joint_upload_source_register.py"
      - ".github/joint-drawing-photo-inbox/**"
      - "scripts/utm_utils.py"
      - "hooks/**"
      - ".github/workflows/validate-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/motor_pdf_upload_parts/**"
      - "scripts/assemble_motor_pdfs.py"
      - "data/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/validate_docs.py"
      - "scripts/validate_geo_answer_readiness.py"
      - "scripts/validate_product_data.py"
      - "scripts/validate_22p_product_media.py"
      - "scripts/validate_sales_policy.py"
      - "scripts/validate_site_urls.py"
      - "scripts/validate_external_catalog.py"
      - "scripts/export_external_catalog.py"
      - "scripts/export_traceparts_catalog.py"
      - "scripts/export_3dfindit_onboarding.py"
      - "scripts/validate_utm_links.py"
      - "scripts/validate_controlled_cad_readiness.py"
      - "scripts/validate_sample_validation_handoff.py"
      - "scripts/validate_design_in_review_decision.py"
      - "scripts/validate_pilot_preparation.py"
      - "scripts/validate_production_release_readiness.py"
      - "scripts/validate_end_to_end_planetary_funnel.py"
      - "scripts/validate_planetary_indexing_readiness.py"
      - "scripts/validate_planetary_download_assets.py"
      - "scripts/validate_motor_quick_downloads.py"
      - "scripts/test_motor_quick_downloads.js"
      - "scripts/build_joint_datasheets.py"
      - "scripts/build_hub_motor_datasheets.py"
      - "scripts/validate_hub_motor_datasheets.py"
      - "scripts/validate_joint_product_media.py"
      - "scripts/validate_joint_upload_source_register.py"
      - ".github/joint-drawing-photo-inbox/**"
      - "scripts/test_joint_download_clicks.js"
      - "scripts/validate_joint_quick_downloads.py"
      - "scripts/validate_stage_specific_cad_boundary.py"
      - "scripts/validate_ratio_stage_selector_data.py"
      - "scripts/validate_selector_discovery_links.py"
      - "scripts/validate_application_selector_funnel.py"
      - "scripts/validate_application_quick_pages.py"
      - "scripts/validate_planetary_application_crosslinks.py"
      - "scripts/validate_inquiry_activation_assets.py"
      - "scripts/validate_planetary_input_speed_range.py"
      - "scripts/utm_utils.py"
      - "hooks/**"
      - ".github/workflows/validate-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble uploaded full-assembly STEP files
        run: python scripts/assemble_public_cad.py

      - name: Reconstruct four authorized original joint STEP assemblies
        run: python scripts/assemble_joint_cad.py

      - name: Assemble verified motor PDF datasheets
        run: python scripts/assemble_motor_pdfs.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate six standard and separate SG-6010HB reference PDF datasheets
        run: python scripts/build_joint_datasheets.py

      - name: Build SG-2877 and SG-2878 source-backed hub reference PDFs
        run: python scripts/build_hub_motor_datasheets.py

      - name: Verify robot joint product images, downloads and release status
        run: python scripts/validate_joint_product_media.py

      - name: Verify new robot joint 2D/photo source release register
        run: python scripts/validate_joint_upload_source_register.py

      - name: Validate documentation structure
        run: python scripts/validate_docs.py

      - name: Reject retired 8000-rpm-era image files and protect five frozen legacy pages
        run: python scripts/validate_legacy_image_and_page_freeze.py

      - name: Decode and audit 12 planetary product photos and page references
        run: python scripts/validate_planetary_product_photos.py

      - name: Validate GEO answer-readiness on high-value pages
        run: python scripts/validate_geo_answer_readiness.py

      - name: Validate product master data
        run: python scripts/validate_product_data.py

      - name: Verify 22P real product evidence and technical image integrity
        run: python scripts/validate_22p_product_media.py

      - name: Validate public sales policy
        run: python scripts/validate_sales_policy.py

      - name: Validate external CAD catalog
        run: python scripts/validate_external_catalog.py

      - name: Validate UTM taxonomy
        run: python scripts/validate_utm_links.py

      - name: Validate planetary ratio-stage selector data
        run: python scripts/validate_ratio_stage_selector_data.py

      - name: Verify planetary continuous input-speed range in public sources
        run: python scripts/validate_planetary_input_speed_range.py

      - name: Validate stage-specific planetary CAD boundary
        run: python scripts/validate_stage_specific_cad_boundary.py

      - name: Validate controlled CAD request readiness
        run: python scripts/validate_controlled_cad_readiness.py

      - name: Validate candidate sample-validation handoff
        run: python scripts/validate_sample_validation_handoff.py

      - name: Validate Design-In review decision layer
        run: python scripts/validate_design_in_review_decision.py

      - name: Validate pilot-preparation and change-control layer
        run: python scripts/validate_pilot_preparation.py

      - name: Validate production-release readiness layer
        run: python scripts/validate_production_release_readiness.py

      - name: Validate end-to-end planetary funnel
        run: python scripts/validate_end_to_end_planetary_funnel.py

      - name: Validate ratio-stage selector JavaScript syntax
        run: node --check docs/assets/javascripts/ratio-stage-selector.js

      - name: Test planetary engineering selector behaviors
        run: node scripts/test_planetary_selector_v2.js

      - name: Validate inquiry-form JavaScript syntax
        run: node --check docs/assets/javascripts/inquiry-form.js

      - name: Test online inquiry delivery and fallback without external POST
        run: node scripts/test_online_inquiry_delivery.js

      - name: Validate analytics-events JavaScript syntax
        run: node --check docs/assets/javascripts/analytics-events.js

      - name: Test planetary engineering file click analytics
        run: node scripts/test_planetary_download_clicks.js

      - name: Test six joint datasheet and STEP click analytics
        run: node scripts/test_joint_download_clicks.js

      - name: Validate candidate Design-In Pack JavaScript syntax
        run: node --check docs/assets/javascripts/candidate-design-in-pack.js

      - name: Validate sample-validation JavaScript syntax
        run: node --check docs/assets/javascripts/sample-validation.js

      - name: Validate Design-In review JavaScript syntax
        run: node --check docs/assets/javascripts/design-in-review.js

      - name: Validate pilot-preparation JavaScript syntax
        run: node --check docs/assets/javascripts/pilot-preparation.js

      - name: Validate production-release JavaScript syntax
        run: node --check docs/assets/javascripts/production-release.js

      - name: Test external catalog export
        run: python scripts/export_external_catalog.py --output /tmp/siggear-planetary-gearboxes.csv

      - name: Test TraceParts mapping export
        run: python scripts/export_traceparts_catalog.py --classification-category-id TEST_CATEGORY --output /tmp/traceparts-products-en.csv

      - name: Test 3Dfindit onboarding export
        run: python scripts/export_3dfindit_onboarding.py --output /tmp/3dfindit-onboarding-matrix.csv

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify SG-6010HB public PDF and unmatched STEP release hold
        run: python scripts/validate_sg6010hb_public_release.py

      - name: Verify hub motor PDFs, source drawing conditions and CAD release hold
        run: python scripts/validate_hub_motor_datasheets.py

      - name: Verify six joint first-screen PDF and original STEP downloads
        run: python scripts/validate_joint_quick_downloads.py

      - name: Preflight published planetary and motor files
        run: python scripts/validate_planetary_download_assets.py

      - name: Validate motor PDF first-screen download matrix
        run: python scripts/validate_motor_quick_downloads.py

      - name: Test motor PDF diameter and winding search
        run: |
          node --check docs/assets/javascripts/motor-quick-downloads.js
          node scripts/test_motor_quick_downloads.js

      - name: Verify rendered model-to-selector links
        run: python scripts/validate_selector_discovery_links.py

      - name: Verify application-to-selector SEO and inquiry context links
        run: python scripts/validate_application_selector_funnel.py

      - name: Validate concise supplier-first OEM application pages
        run: python scripts/validate_application_quick_pages.py

      - name: Validate gearhead model to application links
        run: python scripts/validate_planetary_application_crosslinks.py

      - name: Verify online inquiry activation asset versions
        run: python scripts/validate_inquiry_activation_assets.py

      - name: Validate planetary indexing and crawl readiness
        run: python scripts/validate_planetary_indexing_readiness.py

      - name: Validate canonical URLs, sitemap, robots, and redirects
        run: python scripts/validate_site_urls.py
