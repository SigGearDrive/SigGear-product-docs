name: Validate documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "data/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/validate_docs.py"
      - "scripts/validate_product_data.py"
      - "scripts/validate_sales_policy.py"
      - "scripts/validate_site_urls.py"
      - "scripts/validate_external_catalog.py"
      - "scripts/export_external_catalog.py"
      - "scripts/export_traceparts_catalog.py"
      - "scripts/export_3dfindit_onboarding.py"
      - "scripts/validate_utm_links.py"
      - "scripts/validate_ratio_stage_selector_data.py"
      - "scripts/validate_planetary_input_speed_range.py"
      - "scripts/test_planetary_selector_v2.js"
      - "scripts/validate_stage_specific_cad_boundary.py"
      - "scripts/validate_controlled_cad_readiness.py"
      - "scripts/validate_sample_validation_handoff.py"
      - "scripts/validate_design_in_review_decision.py"
      - "scripts/validate_pilot_preparation.py"
      - "scripts/validate_production_release_readiness.py"
      - "scripts/validate_end_to_end_planetary_funnel.py"
      - "scripts/validate_planetary_indexing_readiness.py"
      - "scripts/utm_utils.py"
      - "hooks/**"
      - ".github/workflows/validate-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/validate_docs.py"
      - "scripts/validate_product_data.py"
      - "scripts/validate_sales_policy.py"
      - "scripts/validate_site_urls.py"
      - "scripts/validate_external_catalog.py"
      - "scripts/export_external_catalog.py"
      - "scripts/export_traceparts_catalog.py"
      - "scripts/export_3dfindit_onboarding.py"
      - "scripts/validate_utm_links.py"
      - "scripts/validate_controlled_cad_readiness.py"
      - "scripts/validate_sample_validation_handoff.py"
      - "scripts/validate_design_in_review_decision.py"
      - "scripts/validate_pilot_preparation.py"
      - "scripts/validate_production_release_readiness.py"
      - "scripts/validate_end_to_end_planetary_funnel.py"
      - "scripts/validate_planetary_indexing_readiness.py"
      - "scripts/validate_stage_specific_cad_boundary.py"
      - "scripts/validate_ratio_stage_selector_data.py"
      - "scripts/validate_planetary_input_speed_range.py"
      - "scripts/utm_utils.py"
      - "hooks/**"
      - ".github/workflows/validate-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate documentation structure
        run: python scripts/validate_docs.py

      - name: Validate product master data
        run: python scripts/validate_product_data.py

      - name: Validate public sales policy
        run: python scripts/validate_sales_policy.py

      - name: Validate external CAD catalog
        run: python scripts/validate_external_catalog.py

      - name: Validate UTM taxonomy
        run: python scripts/validate_utm_links.py

      - name: Validate planetary ratio-stage selector data
        run: python scripts/validate_ratio_stage_selector_data.py

      - name: Verify planetary continuous input-speed range in public sources
        run: python scripts/validate_planetary_input_speed_range.py

      - name: Validate stage-specific planetary CAD boundary
        run: python scripts/validate_stage_specific_cad_boundary.py

      - name: Validate controlled CAD request readiness
        run: python scripts/validate_controlled_cad_readiness.py

      - name: Validate candidate sample-validation handoff
        run: python scripts/validate_sample_validation_handoff.py

      - name: Validate Design-In review decision layer
        run: python scripts/validate_design_in_review_decision.py

      - name: Validate pilot-preparation and change-control layer
        run: python scripts/validate_pilot_preparation.py

      - name: Validate production-release readiness layer
        run: python scripts/validate_production_release_readiness.py

      - name: Validate end-to-end planetary funnel
        run: python scripts/validate_end_to_end_planetary_funnel.py

      - name: Validate ratio-stage selector JavaScript syntax
        run: node --check docs/assets/javascripts/ratio-stage-selector.js

      - name: Test planetary engineering selector behaviors
        run: node scripts/test_planetary_selector_v2.js

      - name: Validate inquiry-form JavaScript syntax
        run: node --check docs/assets/javascripts/inquiry-form.js

      - name: Validate analytics-events JavaScript syntax
        run: node --check docs/assets/javascripts/analytics-events.js

      - name: Validate candidate Design-In Pack JavaScript syntax
        run: node --check docs/assets/javascripts/candidate-design-in-pack.js

      - name: Validate sample-validation JavaScript syntax
        run: node --check docs/assets/javascripts/sample-validation.js

      - name: Validate Design-In review JavaScript syntax
        run: node --check docs/assets/javascripts/design-in-review.js

      - name: Validate pilot-preparation JavaScript syntax
        run: node --check docs/assets/javascripts/pilot-preparation.js

      - name: Validate production-release JavaScript syntax
        run: node --check docs/assets/javascripts/production-release.js

      - name: Test external catalog export
        run: python scripts/export_external_catalog.py --output /tmp/siggear-planetary-gearboxes.csv

      - name: Test TraceParts mapping export
        run: python scripts/export_traceparts_catalog.py --classification-category-id TEST_CATEGORY --output /tmp/traceparts-products-en.csv

      - name: Test 3Dfindit onboarding export
        run: python scripts/export_3dfindit_onboarding.py --output /tmp/3dfindit-onboarding-matrix.csv

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate planetary indexing and crawl readiness
        run: python scripts/validate_planetary_indexing_readiness.py

      - name: Validate canonical URLs, sitemap, robots, and redirects
        run: python scripts/validate_site_urls.py
