name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble uploaded full-assembly STEP files
        run: python scripts/assemble_public_cad.py

      - name: Reconstruct four authorized original joint STEP assemblies
        run: python scripts/assemble_joint_cad.py

      - name: Assemble verified motor PDF datasheets
        run: python scripts/assemble_motor_pdfs.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate six public joint reference PDF datasheets
        run: python scripts/build_joint_datasheets.py

      - name: Verify robot joint product images, downloads and release status
        run: python scripts/validate_joint_product_media.py

      - name: Validate documentation structure
        run: python scripts/validate_docs.py

      - name: Validate product master data
        run: python scripts/validate_product_data.py

      - name: Validate public sales policy
        run: python scripts/validate_sales_policy.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate planetary indexing and crawl readiness
        run: python scripts/validate_planetary_indexing_readiness.py

      - name: Validate canonical URLs, sitemap, and redirects
        run: python scripts/validate_site_urls.py

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch
        run: mkdocs gh-deploy --force --clean --remote-branch gh-pages
