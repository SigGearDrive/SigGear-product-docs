name: Audit live SigGear images

on:
  pull_request:
    paths:
      - "docs/**"
      - "data/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "scripts/audit_site_images.py"
      - "scripts/audit_live_pdf_contacts.py"
      - ".github/workflows/audit-live-images.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MkDocs to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit-images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image and PDF decoders
        run: python -m pip install "Pillow>=10,<13" "pypdf>=5,<7"
      - name: Wait for GitHub Pages to publish the exact source commit
        if: github.event_name == 'workflow_run'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://siggeardrive.github.io/SigGear-product-docs"
          for attempt in $(seq 1 30); do
            found=$(curl -fsSL --connect-timeout 10 --max-time 15 \
              "$base/assets/deployment-commit.txt?revision=$DEPLOY_SHA" || true)
            if [ "$found" = "$DEPLOY_SHA" ]; then
              echo "PASS: live GitHub Pages revision matches $DEPLOY_SHA"
              exit 0
            fi
            echo "Waiting for Pages publication; attempt $attempt/30"
            sleep 10
          done
          echo "::error::GitHub Pages did not expose the deployed commit marker"
          exit 1
      - name: Audit source images on pull requests (do not expect unpublished site pages)
        if: github.event_name == 'pull_request'
        run: python scripts/audit_site_images.py --mode repo --report site-image-audit-report.json
      - name: List PDF revisions requiring a contact-only update
        if: github.event_name == 'pull_request'
        run: python scripts/audit_live_pdf_contacts.py --source-only
      - name: Audit source and published live images after main deployment
        if: github.event_name != 'pull_request'
        run: python scripts/audit_site_images.py --mode both --report site-image-audit-report.json
      - name: Check every downloadable PDF on the published website for correct contact and unchanged content
        if: github.event_name != 'pull_request'
        run: python scripts/audit_live_pdf_contacts.py --report site-pdf-contact-audit.json
      - name: Upload image audit details even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siggear-site-image-audit
          path: |
            site-image-audit-report.json
            site-pdf-contact-audit.json
          if-no-files-found: warn
