name: Audit live SigGear images

on:
  pull_request:
    paths:
      - "scripts/audit_site_images.py"
      - ".github/workflows/audit-live-images.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MkDocs to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit-images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install "Pillow>=10,<13"
      - name: Wait for GitHub Pages to publish the exact source commit
        if: github.event_name == 'workflow_run'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://siggeardrive.github.io/SigGear-product-docs"
          for attempt in $(seq 1 30); do
            found=$(curl -fsSL --connect-timeout 10 --max-time 15 \
              "$base/assets/deployment-commit.txt?revision=$DEPLOY_SHA" || true)
            if [ "$found" = "$DEPLOY_SHA" ]; then
              echo "PASS: live GitHub Pages revision matches $DEPLOY_SHA"
              exit 0
            fi
            echo "Waiting for Pages publication; attempt $attempt/30"
            sleep 10
          done
          echo "::error::GitHub Pages did not expose the deployed commit marker"
          exit 1
      - name: Audit all source images, live pages and referenced image bytes
        run: python scripts/audit_site_images.py --mode both --report site-image-audit-report.json
      - name: Upload image audit details even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siggear-site-image-audit
          path: site-image-audit-report.json
          if-no-files-found: warn
