name: Review 36P original photo clean crops (temporary)
on:
  push:
    branches:
      - image-prep/traceparts-4-real-photos-20261014
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Build lossless-source crops from genuine old photo
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,io,os
          from PIL import Image, ImageOps, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          path='docs/assets/images/products/planetary-gearboxes/36p/36p-real-product-evidence.webp'
          data=subprocess.check_output(['git','show','0a5e5887cd23f841c6dcb8cd4190ab43e3386571:'+path])
          length=int.from_bytes(data[4:8],'little')+8
          if len(data)==length-1: data+=b'\0'
          image=Image.open(io.BytesIO(data))
          image.load()
          image=ImageOps.exif_transpose(image).convert('RGB')
          w,h=image.size
          print('SOURCE_DIMENSIONS',w,h,'declared',length,'real',len(data))
          # Crop only the intact top-right original photo; exclude the corrupt lower photo panels.
          crops={
            'A_clean_upper_78':(w//2,0,w,int((h/2)*.78)),
            'B_clean_upper_86':(w//2,0,w,int((h/2)*.86)),
            'C_clean_upper_91':(w//2,0,w,int((h/2)*.91)),
            'D_inset_upper_86':(int(w*.515),int(h*.025),int(w*.985),int((h/2)*.86))
          }
          out=Path('traceparts-review/36p');out.mkdir(parents=True,exist_ok=True)
          for n,b in crops.items():
              box=image.crop(b)
              canvas=Image.new('RGB',(920,680),'white')
              tile=ImageOps.contain(box,(880,620),Image.Resampling.LANCZOS)
              canvas.paste(tile,((920-tile.width)//2,(680-tile.height)//2))
              jpg=out/(n+'.jpg')
              canvas.save(jpg,quality=97,subsampling=0,optimize=True)
              print('CANDIDATE',n,'sourceBox',b,'exported',jpg.stat().st_size)
          PY
      - name: Commit preview options for manual visual QA (temporary branch only)
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traceparts-review/36p/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Prepare 36P clean photographic crop candidates for QA"
            git push origin HEAD:image-prep/traceparts-4-real-photos-20261014
          fi
